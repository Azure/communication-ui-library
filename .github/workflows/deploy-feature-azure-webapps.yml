name: Deploy feature validation samples

on:
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Build flavor to deploy (beta-release or stable)'
        type: choice
        required: true
        default: beta-release
        options:
          - beta-release
          - stable

# cancel workflow when a newer version of the workflow is triggered on the same github ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: read-all

jobs:
  calling:
    name: Build and Deploy Calling App
    runs-on: ${{ vars.RUNS_ON }}
    permissions:
      # Needed for Azure login
      id-token: write
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 'lts/*'
      - name: Install rush
        run: npm install -g @microsoft/rush@$(jq -r '.rushVersion' "rush.json")
      - name: Install dependencies
        run: rush install
      - name: Switch flavor
        run: rush switch-flavor:${{ inputs.flavor }}
      - name: Build Communication-react
        run: rush build -t @azure/communication-react
      - name: Build Server
        run: rush build -o server
      - name: Build Calling
        run: rush build -o calling
      - name: Package Calling App
        run: rushx package
        working-directory: ./samples/Calling
      - name: Log in with Azure
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Calling
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: acs-ui-dev-web-call-feature-validation
          package: ./samples/Calling/dist

  chat:
    name: Build and Deploy Chat App
    runs-on: ${{ vars.RUNS_ON }}
    permissions:
      # Needed for Azure login
      id-token: write
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 'lts/*'
      - name: Install rush
        run: npm install -g @microsoft/rush@$(jq -r '.rushVersion' "rush.json")
      - name: Install dependencies
        run: rush install
      - name: Switch flavor
        run: rush switch-flavor:${{ inputs.flavor }}
      - name: Build Communication-react
        run: rush build -t @azure/communication-react
      - name: Build Server
        run: rush build -o server
      - name: Build Chat
        run: rush build -o chat
      - name: Package Chat App
        run: rushx package
        working-directory: ./samples/Chat
      - name: Log in with Azure
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy Chat
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: acs-ui-dev-web-chat-feature-validation
          package: ./samples/Chat/dist

  callwithchat:
    name: Build and Deploy CallWithChat App
    runs-on: ${{ vars.RUNS_ON }}
    permissions:
      # Needed for Azure login
      id-token: write
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 'lts/*'
      - name: Install rush
        run: npm install -g @microsoft/rush@$(jq -r '.rushVersion' "rush.json")
      - name: Install dependencies
        run: rush install
      - name: Switch flavor
        run: rush switch-flavor:${{ inputs.flavor }}
      - name: Build Communication-react
        run: rush build -t @azure/communication-react
      - name: Build Server
        run: rush build -o server
      - name: Build CallWithChat
        run: rush build -o callwithchat
      - name: Package CallWithChat Sample Artifact
        run: rushx package
        working-directory: ./samples/CallWithChat
      - name: Log in with Azure
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Deploy CallWithChat
        uses: azure/webapps-deploy@02a81bead70021f5284939794bcec79c271ab383 # v3.0.8
        with:
          app-name: acs-ui-dev-web-callwithchat-feature-validation
          package: ./samples/CallWithChat/dist
